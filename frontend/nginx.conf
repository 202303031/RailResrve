server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Small static assets are content-hashed by Vite, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Reverse-proxy the API to the backend service on the compose network. The full /api/... path is
    # preserved (proxy_pass has no URI), so the backend sees the same routes it always does.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA history fallback: unknown paths return index.html so client-side routing works on reload.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
